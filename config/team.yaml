# Benford team, used for the "Plan" panel on each event (who goes, in what role, who we pitch as speaker).
# Pulled from Slack (@benford.tech accounts) on 2026-10-19. Edit freely; names must be unique.
#
# speaker: true  → shows up in "Pitch as speaker"
# github:        → their GitHub username. Needed to save edits to speaker pitch drafts
#                  (only admins and the speaker themself can edit a speaker's draft).
# bio:           → one or two lines the pitch-email writer can use (role, expertise, talks given)

admins: [Benedetta, Andreas, Mads, Thibault]

roles:          # what someone can go as
  - Attendee
  - Speaker
  - Panelist
  - Booth / sponsor
  - Judge
  - Mentor
  - Recruiting

pitch_statuses: # where the speaker pitch stands
  - To pitch
  - Pitched
  - Accepted
  - Declined

