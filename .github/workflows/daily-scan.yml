name: Daily scan + publish

on:
  schedule:
    - cron: "30 5 * * *"        # every morning, 05:30 UTC (06:30 London in summer)
  workflow_dispatch:
    inputs:
      only:
        description: "Only these search groups (comma separated, blank = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["data/**", "config/**", "site/**", "scanner/build.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  scan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: Scan the web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SCAN_MODEL: ${{ vars.SCAN_MODEL }}
          SITE_URL: ${{ vars.SITE_URL }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python scanner/scan.py --only "$ONLY"
          else
            python scanner/scan.py
          fi
      - name: Commit results
        run: |
          git config user.name "events-radar-bot"
          git config user.email "events-radar-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git push

  publish:
    needs: scan
    if: always() && (needs.scan.result == 'success' || needs.scan.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scanner/build.py --demo
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
