name: Triage flag

# The dashboard's Interested / Pass / We went / Didn't go buttons open a pre-filled issue titled
# "[triage] …". This applies it to data/triage.yaml, closes the issue and republishes the site.
# Only issues from the repo owner, collaborators or org members are applied (the repo is public).

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: triage
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      startsWith(github.event.issue.title, '[triage]') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Apply flag
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          out=$(python scanner/apply_triage.py)
          echo "summary=$out" >> "$GITHUB_OUTPUT"
      - name: Commit
        env:
          SUMMARY: ${{ steps.apply.outputs.summary }}
        run: |
          git config user.name "events-radar-bot"
          git config user.email "events-radar-bot@users.noreply.github.com"
          git add data/triage.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Triage: $SUMMARY"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 3; done
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.apply.outputs.summary }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue close "$NUMBER" -R "$GITHUB_REPOSITORY" -c "Saved: $SUMMARY. The dashboard updates in about a minute."

  publish:
    needs: apply
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
