<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benford Events Radar</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Caslon+Text:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="https://benford.tech" target="_blank" rel="noopener" aria-label="Benford">
        <span class="mark" aria-hidden="true"></span><span class="wordmark">BENFORD</span>
      </a>
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button role="tab" data-tab="events" aria-selected="true">Events</button>
        <button role="tab" data-tab="hackathons" aria-selected="false">Hackathons</button>
        <button role="tab" data-tab="runs" aria-selected="false">Scan log</button>
      </nav>
      <div class="nav-actions">
        <a class="pill ghost hide-sm" href="calendar/team.ics" title="Subscribe in Google Calendar or Outlook">Calendar</a>
        <a class="pill ghost hide-sm" href="api/events.json">API</a>
        <a class="pill primary" id="add-event" href="#" hidden>Add event</a>
      </div>
    </div>
  </header>

  <section class="hero wrap">
    <p class="eyebrow">Benford · Events radar</p>
    <h1 id="hero-title">Where we should be next</h1>
    <p class="lede" id="last-scan">Loading…</p>
    <div id="demo-banner" class="banner" hidden>
      Demo data. The first morning scan hasn't run yet, so these entries are placeholders.
    </div>
  </section>

  <main class="wrap">
    <!-- EVENTS -->
    <section id="tab-events" class="tab">
      <div class="stats" id="stats"></div>

      <div class="filters">
        <input id="q" type="search" placeholder="Search events, organisers, cities">
        <select id="f-category" aria-label="Category">
          <option value="">All categories</option>
          <option value="cfo">CFO &amp; finance leaders</option>
          <option value="audit_accounting">Audit &amp; accounting</option>
          <option value="finance_tech">Fintech &amp; AI in finance</option>
          <option value="founders_investors">Founders &amp; investors</option>
          <option value="other">Other</option>
        </select>
        <select id="f-country" aria-label="Country">
          <option value="">UK, Norway &amp; elsewhere</option>
          <option value="uk">UK</option>
          <option value="norway">Norway</option>
          <option value="other">Elsewhere</option>
        </select>
        <select id="f-status" aria-label="Status">
          <option value="">Any status</option>
          <option value="new">Not triaged</option>
          <option value="attending">Attending</option>
          <option value="shortlisted">Shortlisted</option>
          <option value="maybe">Maybe</option>
          <option value="skip">Skipped</option>
        </select>
        <label class="range"><span class="mono">Min fit</span><input id="f-min" type="range" min="0" max="100" step="5" value="40"><output id="f-min-out">40</output></label>
        <div class="toggles">
          <label class="toggle"><input id="f-speaker" type="checkbox"><span>Speaker slots</span></label>
          <label class="toggle"><input id="f-new" type="checkbox"><span>New this week</span></label>
          <label class="toggle"><input id="f-past" type="checkbox"><span>Show past</span></label>
        </div>
      </div>
      <div id="event-list"></div>
    </section>

    <!-- HACKATHONS -->
    <section id="tab-hackathons" class="tab" hidden>
      <div class="map-head">
        <div class="seg" role="group" aria-label="Region">
          <button data-region="london" aria-pressed="true">London</button>
          <button data-region="norway" aria-pressed="false">Norway</button>
          <button data-region="all" aria-pressed="false">Both</button>
        </div>
        <p class="hint" id="uni-filter-label">Click a university to filter the list.</p>
      </div>
      <div class="map-layout">
        <div id="map" aria-label="Map of universities and hackathons"></div>
        <div id="hack-list"></div>
      </div>
    </section>

    <!-- RUNS -->
    <section id="tab-runs" class="tab" hidden>
      <div id="runs"></div>
    </section>
  </main>

  <footer class="wrap foot">
    <span class="mono">Benford Technologies · London &amp; Oslo</span>
    <span class="mono">Scans every morning at 05:30 UTC</span>
  </footer>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
