<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benford Events Radar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <div>
        <h1>Events Radar</h1>
        <p class="sub" id="last-scan">Loading…</p>
      </div>
      <nav class="links">
        <a href="calendar/team.ics" title="Subscribe in Google Calendar / Outlook">Team calendar</a>
        <a href="calendar/radar.ics">Radar calendar</a>
        <a href="api/events.json">API</a>
        <a id="add-event" href="#" hidden>+ Add event</a>
      </nav>
    </div>
    <div class="wrap">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="events" aria-selected="true">Events</button>
        <button role="tab" data-tab="hackathons" aria-selected="false">University hackathons</button>
        <button role="tab" data-tab="runs" aria-selected="false">Scan log</button>
      </div>
    </div>
  </header>

  <div id="demo-banner" class="wrap banner" hidden>
    Demo data. The first morning scan hasn't run yet, so these entries are placeholders.
  </div>

  <main class="wrap">
    <!-- EVENTS -->
    <section id="tab-events" class="tab">
      <div class="stats" id="stats"></div>
      <div class="filters">
        <input id="q" type="search" placeholder="Search events, organisers, cities…">
        <select id="f-category">
          <option value="">All categories</option>
          <option value="cfo">CFO &amp; finance leaders</option>
          <option value="audit_accounting">Audit &amp; accounting</option>
          <option value="finance_tech">Fintech &amp; AI in finance</option>
          <option value="founders_investors">Founders &amp; investors</option>
          <option value="other">Other</option>
        </select>
        <select id="f-country">
          <option value="">UK + Norway + other</option>
          <option value="uk">UK</option>
          <option value="norway">Norway</option>
          <option value="other">Elsewhere</option>
        </select>
        <select id="f-status">
          <option value="">Any status</option>
          <option value="new">Not triaged</option>
          <option value="attending">Attending</option>
          <option value="shortlisted">Shortlisted</option>
          <option value="maybe">Maybe</option>
          <option value="skip">Skipped</option>
        </select>
        <label class="range">Min fit <input id="f-min" type="range" min="0" max="100" step="5" value="40"><output id="f-min-out">40</output></label>
        <label class="check"><input id="f-speaker" type="checkbox"> Speaker slots</label>
        <label class="check"><input id="f-new" type="checkbox"> New this week</label>
        <label class="check"><input id="f-past" type="checkbox"> Show past</label>
      </div>
      <div id="event-list"></div>
    </section>

    <!-- HACKATHONS -->
    <section id="tab-hackathons" class="tab" hidden>
      <div class="map-head">
        <div class="seg" role="group" aria-label="Region">
          <button data-region="london" aria-pressed="true">London</button>
          <button data-region="norway" aria-pressed="false">Norway</button>
          <button data-region="all" aria-pressed="false">Both</button>
        </div>
        <p class="hint" id="uni-filter-label">Click a university to filter the list.</p>
      </div>
      <div class="map-layout">
        <div id="map" aria-label="Map of universities and hackathons"></div>
        <div id="hack-list"></div>
      </div>
    </section>

    <!-- RUNS -->
    <section id="tab-runs" class="tab" hidden>
      <div id="runs"></div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
